# target.path: directory of the project to scan (M1) and to write generated tests into (M2).
# This is the SHARED, single source of truth for BOTH milestones.
# Precedence:
#   M1: TARGET constant in metadata/Cli.java (optional override) > target.path > --target= CLI arg
#   M2: target.path > --target= CLI arg
# If nothing is set, the app FAILS FAST with a clear message (it will NOT silently scan the sample).
# To use the bundled sample explicitly, set: target.path=sample-target
target.path=sample-target

# Production and test source roots relative to target.path (comma-separated).
# Maven/Gradle default: src/main/java + src/test/java
# Flat layout: src + test
target.source.roots=src/main/java
target.test.roots=src/test/java
target.test.file.suffixes=Test.java,Tests.java,IT.java

# output.dir: where metadata JSON + dependency-graph.json are written (relative to this repo).
output.dir=output

# output.clean: if true, wipe output.dir before writing (bounded to output.dir only).
output.clean=true

# --- Optional: human-readable dependency graph (add-on; not consumed by M2) ---
# Set enabled=false or remove DependencyGraphYamlWriter from Cli.OUTPUT_ADDONS to disable.
dependency-graph.yaml.enabled=true
dependency-graph.yaml.path=dependency-graph.yml
# Comma-separated package prefixes — only internal deps matching these appear under each class.
dependency-graph.internal.packages=com.sample

# --- M2: Test Infra Generation ---
# metadata.dir: M1 output consumed by M2 (per-FQN JSON).
metadata.dir=output/metadata
# testgen.mirror.dir: local mirror root for classes that ALREADY have a test in the target
# (we never overwrite the target). Mirrors the configured target.test.roots layout under this dir.
testgen.mirror.dir=output/tests-local-mirror
# testgen.report: human-readable report of what was created where (and mock decisions).
testgen.report=output/testgen-report.md

# --- M3: LLM Prompt Automation ---
# Consumes M1 metadata + M2 test skeletons + optional JaCoCo/PIT reports from target (or toolchain fallback).
promptgen.output.dir=output/prompts
promptgen.report=output/promptgen-report.md
# Package filter for which SUT classes receive prompts (defaults to dependency-graph.internal.packages).
promptgen.internal.packages=com.sample
# Optional explicit report paths; blank = target build/reports first, then toolchain build/reports.
promptgen.jacoco.report=
promptgen.pitest.report=
